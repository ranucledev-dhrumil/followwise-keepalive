name: ping

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 120 --retry 1 --retry-delay 5 -o /dev/null -w "HTTP %{http_code}\n" "${{ vars.HEALTH_URL }}/health"
